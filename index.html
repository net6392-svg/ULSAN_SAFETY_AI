<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 간섭공정 및 AI 자동협의 시스템</title>
    <!-- Supabase 실시간 클라우드 DB 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #1e293b; color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .floor-tabs { display: flex; gap: 8px; }
        .tab-btn { background: #334155; color: #cbd5e1; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s; }
        .tab-btn.active { background: #2563eb; color: white; transform: translateY(-1px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        .container { display: flex; flex: 1; overflow: hidden; }
        
        .map-section { flex: 3; position: relative; background: #090d16; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .map-toolbar { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; align-items: center; }
        .map-instructions { background: #1e293b; color: #38bdf8; border: 1px solid #0284c7; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        .db-status-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }

        /* 💡 맵 레이아웃 정상화 및 스크롤바 허용 설정 */
        .map-card { position: relative; flex: 1; width: 100%; background-color: #0b132b; background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px); background-size: 20px 20px; border-radius: 8px; border: 1px solid #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); overflow: auto; }
        
        /* 💡 마우스 줌 계산을 위해 CSS transition(부드러운 효과) 제거하여 즉시 크기 변환되도록 설정 */
        .map-wrapper { position: relative; display: block; width: 100%; min-width: 100%; transform-origin: top left; }
        
        .map-img { display: block; width: 100%; height: auto; cursor: crosshair; user-select: none; }
        .markers-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .marker { position: absolute; transform: translate(-50%, -50%); padding: 6px 10px; border-radius: 16px; font-size: 11px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); white-space: nowrap; z-index: 10; border: 1px solid rgba(255,255,255,0.4); pointer-events: auto; user-select: none; touch-action: none; transition: transform 0.1s; }
        .marker:hover { transform: translate(-50%, -50%) scale(1.1); z-index: 50; }
        .marker:active, .marker.dragging { cursor: grabbing; scale: 1.15; z-index: 100; box-shadow: 0 8px 16px rgba(0,0,0,0.8); }
        .marker-normal { background: #059669; }
        .marker-resolved { background: #0284c7; border: 1px solid #38bdf8; }
        .marker-hazard { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.15); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* 사이드바 너비 고정으로 레이아웃 깨짐 방지 */
        .sidebar { width: 380px; background: #1e293b; border-left: 1px solid #334155; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; color: #f8fafc; flex-shrink: 0; }
        .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; }
        .card h3 { font-size: 15px; margin-bottom: 12px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
        
        .ai-dropzone { border: 2px dashed #0284c7; background: #0284c710; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .ai-dropzone:hover { background: #0284c725; border-color: #38bdf8; }
        .ai-dropzone p { font-size: 13px; color: #38bdf8; font-weight: bold; margin-top: 4px; }
        .ai-status { margin-top: 10px; font-size: 12px; color: #a7f3d0; background: #064e3b; padding: 8px; border-radius: 4px; display: none; line-height: 1.5; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #94a3b8; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #334155; background: #1e293b; color: white; border-radius: 6px; }
        .coords-preview { font-size: 11px; color: #38bdf8; font-weight: bold; margin-top: 4px; word-break: break-all; background: #090d16; padding: 6px; border-radius: 4px; border: 1px solid #0284c7; }
        
        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background: #1d4ed8; }
        
        .btn-save-all { width: 100%; background: #059669; color: white; border: 1px solid #10b981; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .btn-save-all:hover { background: #047857; transform: translateY(-1px); }
        
        .btn-clear-all { width: 100%; background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 6px; transition: all 0.2s; }
        .btn-clear-all:hover { background: #991b1b; color: white; }
        
        .alert-item { background: #450a0a; border: 1px solid #991b1b; border-left: 4px solid #ef4444; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .alert-title { color: #fca5a5; font-weight: bold; font-size: 12px; margin-bottom: 2px; }
        .alert-desc { font-size: 11px; color: #fecaca; }

        .modal-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal-card { background: #1e293b; border: 1px solid #38bdf8; border-radius: 12px; width: 340px; padding: 20px; color: white; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .modal-header { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .modal-body { font-size: 13px; line-height: 1.6; margin-bottom: 16px; color: #cbd5e1; }
        .modal-actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-modal { padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-resolve { background: #059669; color: white; }
        .btn-unresolve { background: #d97706; color: white; }
        .btn-delete { background: #dc2626; color: white; }
        .btn-close { background: #475569; color: white; }
    </style>
</head>
<body>

<header>
    <h2>🏗️ 울산다운2 B2BL 현장 AI 간섭공정 분석 시스템</h2>
    <div class="floor-tabs">
        <button class="tab-btn active" id="tab-1F" onclick="switchFloor('1F')">지상 1층</button>
        <button class="tab-btn" id="tab-B1" onclick="switchFloor('B1')">지하 1층</button>
        <button class="tab-btn" id="tab-B2" onclick="switchFloor('B2')">지하 2층</button>
        <button class="tab-btn" id="tab-B3" onclick="switchFloor('B3')">지하 3층</button>
    </div>
</header>

<div class="container">
    <div class="map-section">
        <div class="map-toolbar">
            <div class="map-instructions">🌐 중앙 DB와 실시간으로 연결되며 [저장] 버튼을 통해 확실하게 보존할 수 있습니다.</div>
            <div id="dbStatusBadge" class="db-status-badge">🟢 중앙 서버 연동 완료</div>
        </div>
        
        <!-- 💡 중복되던 map-card 태그를 제거하고 하나로 합쳤습니다. -->
        <div class="map-card" id="mapCard">
            <div class="map-wrapper">
                <img id="bgMap" class="map-img" src="./images/1f.jpg" alt="현장 도면" onerror="this.alt='도면 이미지 파일(images/1f.jpg 등)을 찾을 수 없습니다.'">
                <div id="markersArea" class="markers-layer"></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="card">
            <h3>🤖 AI 명일 작업 문서 자동 인식</h3>
            <div class="ai-dropzone" onclick="document.getElementById('aiFileInput').click()">
                <span style="font-size:22px;">📸</span>
                <p>작업예정사항 이미지 업로드</p>
                <span style="font-size:11px; color:#94a3b8;">클릭하여 지호, TKE 등 명일작업 서류 선택</span>
            </div>
            <input type="file" id="aiFileInput" accept="image/*" style="display:none;" onchange="handleAiImageUpload(event)">
            <div id="aiStatus" class="ai-status"></div>
            
            <div style="margin-top:8px;">
                <input type="password" id="geminiApiKey" placeholder="Gemini API Key (입력 시 실시간 Vision AI 사용)" style="width:100%; font-size:11px; padding:6px; background:#0f172a; border:1px solid #334155; color:#cbd5e1; border-radius:4px;">
            </div>
        </div>

        <div class="card">
            <h3>📝 작업 수동 등록 / AI 결과</h3>
            <div class="form-group">
                <label>업체명</label>
                <input type="text" id="company" placeholder="예: (주)지호, TKE">
            </div>
            <div class="form-group">
                <label>작업 층수</label>
                <select id="floorSelect" onchange="switchFloor(this.value)">
                    <option value="1F">지상 1층</option>
                    <option value="B1">지하 1층</option>
                    <option value="B2">지하 2층</option>
                    <option value="B3">지하 3층</option>
                    <option value="B_ALL">지하 전체 (1~3층 동시등록)</option>
                </select>
            </div>
            <div class="form-group">
                <label>선택/드래그 위치 좌표</label>
                <div id="coordsDisplay" class="coords-preview">📍 도면 클릭 또는 핀 드래그 시 좌표가 표시됩니다.</div>
            </div>
            <div class="form-group">
                <label>주요 위험 작업 내용 및 동 번호</label>
                <input type="text" id="workDetail" placeholder="예: 101동-111동 단위세대 하자처리">
            </div>
            <button class="btn-submit" onclick="addWorkItem()">도면에 핀 추가</button>
            
            <button id="btnSaveAll" class="btn-save-all" onclick="manualSaveAllData()">💾 전체 변경사항 확실하게 저장하기</button>
            
            <button class="btn-clear-all" onclick="clearAllPins()">🗑️ 전체 핀 일괄 삭제 (초기화)</button>
        </div>

        <div class="card">
            <h3>⚠️ 동시작업/간섭 발생 구간</h3>
            <div id="conflictList">
                <p style="font-size: 12px; color: #64748b;">현재 선택한 층에 간섭 공정이 없습니다.</p>
            </div>
        </div>
    </div>
</div>

<div id="pinModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <span id="modalTitle">📌 작업 상세 정보</span>
            <span style="cursor:pointer;" onclick="closeModal()">✕</span>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://kkkmvhjagmyldbgktsfy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_KKCTlGMnzAu8Z2kqmYJcYw_3hoRuAaR";

    let currentFloor = '1F';
    let selectedCoords = null;
    let activeDragId = null;
    let isDragging = false;
    let dragStartPos = { x: 0, y: 0 };
    let selectedPinId = null;
    let supabaseClient = null;

    const floorMaps = {
        '1F': './images/1f.jpg',
        'B1': './images/b1f.jpg',
        'B2': './images/b2f.jpg',
        'B3': './images/b3f.jpg'
    };

    const buildingCoords = {
        '101': { x: 22.0, y: 21.0 }, '102': { x: 22.0, y: 32.5 }, '103': { x: 22.0, y: 45.2 },
        '104': { x: 22.0, y: 57.5 }, '105': { x: 22.0, y: 69.5 }, '106': { x: 22.0, y: 80.0 },
        '107': { x: 35.0, y: 80.0 }, '108': { x: 35.0, y: 66.5 }, '109': { x: 35.0, y: 57.0 },
        '110': { x: 35.0, y: 45.2 }, '111': { x: 35.0, y: 32.5 }, '112': { x: 46.0, y: 53.0 },
        '113': { x: 46.0, y: 64.0 }, '114': { x: 55.0, y: 58.0 }, '115': { x: 55.0, y: 46.5 },
        '116': { x: 55.0, y: 34.0 }, '117': { x: 66.0, y: 45.5 }, '118': { x: 66.0, y: 31.5 },
        '119': { x: 66.0, y: 21.0 }, '120': { x: 74.3, y: 35.2 }
    };

    let workList = [];

    window.addEventListener('DOMContentLoaded', () => {
        switchFloor('1F');
        autoInitCloudDb();
    });

    function autoInitCloudDb() {
        if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                document.getElementById('dbStatusBadge').innerText = '🌐 중앙 DB 연결 완료 (실시간 연동 중)';
                document.getElementById('dbStatusBadge').style.background = '#0284c7';
                document.getElementById('dbStatusBadge').style.borderColor = '#38bdf8';
                
                fetchCloudData();
                subscribeRealtime();
            } catch(e) {
                console.error("DB 연동 실패", e);
                loadSavedData();
            }
        } else {
            document.getElementById('dbStatusBadge').innerText = '🟢 로컬 저장소 동작 중';
            document.getElementById('dbStatusBadge').style.background = '#064e3b';
            loadSavedData();
        }
    }

    async function fetchCloudData() {
        if (!supabaseClient) {
            loadSavedData();
            return;
        }
        const { data, error } = await supabaseClient.from('work_pins').select('*');
        if (!error && data) {
            workList = data;
            saveToLocalStorage();
            render();
        } else {
            loadSavedData();
        }
    }

    function subscribeRealtime() {
        if (!supabaseClient) return;
        supabaseClient
            .channel('public:work_pins')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'work_pins' }, () => {
                fetchCloudData();
            })
            .subscribe();
    }

    async function manualSaveAllData() {
        const btn = document.getElementById('btnSaveAll');
        btn.innerText = '⏳ 저장 처리 중...';
        btn.style.background = '#d97706';

        saveToLocalStorage();

        if (supabaseClient && workList.length > 0) {
            try {
                const { error } = await supabaseClient.from('work_pins').upsert(workList);
                if (error) console.error("Supabase upsert 오류:", error);
            } catch (err) {
                console.error("DB 저장 오류:", err);
            }
        }

        setTimeout(() => {
            btn.innerText = '✅ 모든 작업 핀이 확실히 저장되었습니다!';
            btn.style.background = '#2563eb';
            setTimeout(() => {
                btn.innerText = '💾 전체 변경사항 확실하게 저장하기';
                btn.style.background = '#059669';
            }, 2500);
        }, 400);
    }

    async function syncSavePin(pinData) {
        saveToLocalStorage();
        if (supabaseClient) await supabaseClient.from('work_pins').upsert(pinData);
    }

    async function syncDeletePin(pinId) {
        saveToLocalStorage();
        if (supabaseClient) await supabaseClient.from('work_pins').delete().eq('id', pinId);
    }

    async function clearAllPins() {
        if (!workList || workList.length === 0) {
            alert('삭제할 작업 핀이 존재하지 않습니다.');
            return;
        }

        if (!confirm('⚠️ 정말로 등록된 모든 작업 핀을 삭제하시겠습니까?\n이 작업은 클라우드 데이터베이스에서도 모두 삭제됩니다.')) return;

        if (supabaseClient) {
            try { await supabaseClient.from('work_pins').delete().not('id', 'is', null); } 
            catch (dbErr) { console.error("DB 통신 예외 발생:", dbErr); }
        }

        workList = [];
        saveToLocalStorage();
        render();
        alert("모든 작업 핀이 삭제되었습니다.");
    }

    function loadSavedData() {
        const saved = localStorage.getItem('ulsan_b2_work_list');
        if (saved) { try { workList = JSON.parse(saved); } catch (e) {} }
        render();
    }

    function saveToLocalStorage() {
        localStorage.setItem('ulsan_b2_work_list', JSON.stringify(workList));
    }

    document.getElementById('bgMap').addEventListener('click', function(e) {
        if (activeDragId || isDragging) return;
        const rect = this.getBoundingClientRect();
        const x = parseFloat((((e.clientX - rect.left) / rect.width) * 100).toFixed(1));
        const y = parseFloat((((e.clientY - rect.top) / rect.height) * 100).toFixed(1));

        selectedCoords = { x, y };
        document.getElementById('coordsDisplay').innerText = `'수동위치': { x: ${x}, y: ${y} }`;
    });

    function switchFloor(floor) {
        if (floor === 'B_ALL') floor = 'B1';
        currentFloor = floor;
        document.getElementById('floorSelect').value = floor;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${floor}`);
        if(activeTab) activeTab.classList.add('active');

        document.getElementById('bgMap').src = floorMaps[floor];
        selectedCoords = null;
        document.getElementById('coordsDisplay').innerText = '📍 도면 클릭 또는 핀 드래그 시 좌표가 표시됩니다.';
        
        // 층 이동 시 줌 초기화
        currentZoomPercent = 100;
        mapWrapperElement.style.width = '100%';
        mapWrapperElement.style.minWidth = '100%';
        
        render();
    }

    function extractBuildingNumbers(text) {
        if (!text) return [];
        const buildings = new Set();
        
        const rangeRegex = /(\d{3})\s*(?:동)?\s*[-~]\s*(\d{3})\s*(?:동)?/g;
        let match;
        while ((match = rangeRegex.exec(text)) !== null) {
            const start = parseInt(match[1], 10);
            const end = parseInt(match[2], 10);
            if (start <= end) {
                for (let i = start; i <= end; i++) buildings.add(i.toString());
            }
        }

        const cleanedText = text.replace(rangeRegex, '');
        const singleRegex = /(\d{3})(?:동)?/g;
        while ((match = singleRegex.exec(cleanedText)) !== null) {
            buildings.add(match[1]);
        }
        return Array.from(buildings).sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
    }

    async function handleAiImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        runSmartFileOcr(file);
    }

    async function runSmartFileOcr(file) {
        const apiKeyInputs = document.querySelectorAll('input');
        let apiKey = '';
        apiKeyInputs.forEach(input => {
            if (input.placeholder && input.placeholder.includes('Gemini API Key')) {
                apiKey = input.value.trim();
            }
        });

        if (!apiKey) {
            alert('🔑 Gemini API Key가 입력되지 않았습니다!\n화면 하단의 입력란에 API 키를 입력한 후 다시 이미지를 업로드해주세요.');
            return;
        }

        const statusBox = document.getElementById('aiStatus');
        statusBox.style.display = 'block';
        statusBox.innerHTML = `⏳ <strong>[Gemini Vision AI 분석 중...]</strong><br>문서 이미지를 정밀 스캔하고 있습니다...`;

        try {
            const base64Data = await fileToBase64(file);
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
            
            const promptText = `이 건설 현장 위험작업예정사항 문서 이미지에서 정보를 추출해줘.
            중요: 표의 '작업사항' 란을 보면 '동' 항목과 '지하' 항목이 구분되어 있어. 두 항목에 모두 내용이 있다면 절대로 하나만 쓰지 말고 items 배열 안에 각각 개별 객체로 분리해서 두 개 다 만들어줘.
            동 번호가 쉼표(,)로 연결되어 있어도 모두 buildingText에 적어줘.
            
            반드시 다른 사설 없이 아래 순수 JSON 형식으로만 답해:
            {
              "company": "업체명 (예: 두합크린텍)",
              "items": [
                {
                  "floors": ["1F"],
                  "detail": "지상/동 작업 내용 (내용란이 비어있고 동 번호만 있다면 동 번호들을 내용에 기재)",
                  "buildingText": "102, 105, 109, 110동 등 (적혀있는 동 번호 전부 기재)"
                },
                {
                  "floors": ["B3"],
                  "detail": "지하 작업 내용 (예: 지하3층 우수기계실 부스타펌프...)",
                  "buildingText": ""
                }
              ]
            }`;

            const apiResponse = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: file.type || "image/png", data: base64Data } }
                        ]
                    }]
                })
            });

            const data = await apiResponse.json();
            if (data.error) throw new Error(data.error.message);

            const rawText = data.candidates[0].content.parts[0].text;
            const jsonStr = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const extracted = JSON.parse(jsonStr);

            applyExtractedData(extracted);
        } catch (error) {
            console.error(error);
            statusBox.innerHTML = `⚠️ <strong>[AI 분석 오류 발생]</strong><br>• 원인: ${error.message || 'API 키 혹은 네트워크 오류'}<br>👉 API 키를 올바르게 입력했는지 확인해주세요.`;
            alert(`❌ AI 분석 실패: ${error.message}\nAPI 키가 올바른지 확인해주세요.`);
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    function applyExtractedData(extracted) {
        document.getElementById('company').value = extracted.company || '';
        let totalCount = 0;
        let summaryList = [];
        let hasBuildings = false;

        if (!extracted.items || !Array.isArray(extracted.items)) {
            extracted.items = [];
        }

        extracted.items.forEach(item => {
            const bList = extractBuildingNumbers(item.detail || item.buildingText);
            
            let validFloors = [];
            if (Array.isArray(item.floors) && item.floors.length > 0 && item.floors[0]) {
                validFloors = item.floors;
            } else if (item.floor) {
                validFloors = [item.floor];
            } else {
                validFloors = [currentFloor];
            }
            
            if (bList.length > 0) {
                hasBuildings = true;
                let floorLabel = '';
                if (validFloors.length > 1) {
                    floorLabel = '지하 전체 (B1~B3)';
                } else {
                    const f = validFloors[0].toString();
                    if (f === '1F') floorLabel = '지상 1층';
                    else if (f.startsWith('B')) floorLabel = `지하 ${f.replace('B', '')}층`;
                    else floorLabel = `${f}층`;
                }

                summaryList.push(`• <strong>[${floorLabel}]</strong> ${bList.length}개 동 (${bList[0]}동~${bList[bList.length-1]}동)`);

                validFloors.forEach(targetFloor => {
                    bList.forEach(bNum => {
                        totalCount++;
                        const coord = buildingCoords[bNum] || { x: 50, y: 50 };
                        const newPin = {
                            id: 'pin_' + Date.now() + '_' + Math.floor(Math.random()*10000),
                            company: extracted.company || '업체명 미상',
                            building_num: bNum,
                            floor: targetFloor,
                            detail: item.detail || '',
                            x: coord.x,
                            y: coord.y,
                            resolved: false
                        };
                        workList.push(newPin);
                        syncSavePin(newPin);
                    });
                });
            } else {
                if (item.detail) {
                    document.getElementById('workDetail').value = item.detail;
                }
            }
        });

        const statusBox = document.getElementById('aiStatus');
        statusBox.style.display = 'block';

        if (hasBuildings && totalCount > 0) {
            statusBox.innerHTML = `✅ <strong>[AI 서류 스캔 및 자동 층별 분할 배치]</strong><br>• 업체명: ${extracted.company}<br>${summaryList.join('<br>')}<br>👉 (총 ${totalCount}개 핀 배치 및 자동 저장 완료)`;
            render();
        } else {
            const workDetailVal = document.getElementById('workDetail').value || '작업 내용';
            statusBox.innerHTML = `⚠️ <strong>[위치 직접 지정 필요]</strong><br>• 업체명: ${extracted.company}<br>• 내용: ${workDetailVal}<br>👉 서류에 명확한 동 번호가 없어 도면 위를 클릭해 위치를 지정해 주세요.`;
            alert(`📍 [${extracted.company}] 서류 정보를 불러왔습니다.\n\n서류 내에 특정 동 번호가 없으므로,\n도면 위에서 작업 위치를 클릭한 뒤 [도면에 핀 추가] 버튼을 눌러주세요!`);
        }
    }

    function addWorkItem() {
        const company = document.getElementById('company').value;
        const detail = document.getElementById('workDetail').value;
        const selectedFloorOpt = document.getElementById('floorSelect').value;

        if (!company || !detail) {
            alert('업체명과 작업 내용을 입력해 주세요.');
            return;
        }

        const targetFloors = (selectedFloorOpt === 'B_ALL') ? ['B1', 'B2', 'B3'] : [selectedFloorOpt];
        const bList = extractBuildingNumbers(detail);

        targetFloors.forEach(targetFloor => {
            if (bList.length > 0) {
                bList.forEach(bNum => {
                    const coord = buildingCoords[bNum] || selectedCoords || { x: 50, y: 50 };
                    const newPin = {
                        id: 'pin_' + Date.now() + '_' + Math.floor(Math.random()*10000),
                        company: company,
                        building_num: bNum,
                        floor: targetFloor,
                        detail: detail,
                        x: coord.x,
                        y: coord.y,
                        resolved: false
                    };
                    workList.push(newPin);
                    syncSavePin(newPin);
                });
            } else {
                const newPin = {
                    id: 'pin_' + Date.now() + '_' + Math.floor(Math.random()*10000),
                    company: company,
                    building_num: '',
                    floor: targetFloor,
                    detail: detail,
                    x: selectedCoords ? selectedCoords.x : 50,
                    y: selectedCoords ? selectedCoords.y : 50,
                    resolved: false
                };
                workList.push(newPin);
                syncSavePin(newPin);
            }
        });

        document.getElementById('company').value = '';
        document.getElementById('workDetail').value = '';
        selectedCoords = null;
        document.getElementById('coordsDisplay').innerText = '📍 도면 클릭 또는 핀 드래그 시 좌표가 표시됩니다.';
        
        render();
    }

    function openPinModal(item) {
        selectedPinId = item.id;
        const modal = document.getElementById('pinModal');
        const modalBody = document.getElementById('modalBody');
        const modalActions = document.getElementById('modalActions');

        const floorName = item.floor === '1F' ? '지상 1층' : `지하 ${item.floor.replace('B', '')}층`;

        modalBody.innerHTML = `
            <p><strong>🏢 업체명:</strong> ${item.company}</p>
            <p><strong>📍 위치/동:</strong> ${floorName} ${item.building_num ? item.building_num + '동' : '수동 지정위치'}</p>
            <p><strong>🔧 작업내용:</strong> ${item.detail}</p>
            <p><strong>🤝 협의 상태:</strong> ${item.resolved ? '<span style="color:#38bdf8; font-weight:bold;">✅ 협의 완료 (경고 해제됨)</span>' : '<span style="color:#fca5a5; font-weight:bold;">⚠️ 미협의 (간섭 발생 가능)</span>'}</p>
        `;

        modalActions.innerHTML = `
            ${item.resolved 
                ? `<button class="btn-modal btn-unresolve" onclick="toggleResolveStatus('${item.id}', false)">⚠️ 미협의/간섭 상태로 변경</button>`
                : `<button class="btn-modal btn-resolve" onclick="toggleResolveStatus('${item.id}', true)">✅ 공정간섭 협의 완료 처리</button>`
            }
            <button class="btn-modal btn-delete" onclick="deletePin('${item.id}')">🗑️ 이 핀 삭제</button>
            <button class="btn-modal btn-close" onclick="closeModal()">닫기</button>
        `;

        modal.style.display = 'flex';
    }

    function toggleResolveStatus(id, resolved) {
        const target = workList.find(w => w.id.toString() === id.toString());
        if (target) {
            target.resolved = resolved;
            syncSavePin(target);
            render();
            closeModal();
        }
    }

    function deletePin(id) {
        if (confirm('해당 작업 핀을 삭제하시겠습니까?')) {
            workList = workList.filter(w => w.id.toString() !== id.toString());
            syncDeletePin(id);
            render();
            closeModal();
        }
    }

    function closeModal() {
        document.getElementById('pinModal').style.display = 'none';
    }

    function render() {
        const markersArea = document.getElementById('markersArea');
        const conflictList = document.getElementById('conflictList');
        markersArea.innerHTML = '';
        conflictList.innerHTML = '';

        const filtered = workList.filter(item => item.floor === currentFloor);
        const activeUnresolved = filtered.filter(item => !item.resolved);
        const conflictGroups = [];

        activeUnresolved.forEach((item, index) => {
            for (let i = index + 1; i < activeUnresolved.length; i++) {
                const target = activeUnresolved[i];
                const distance = Math.hypot(item.x - target.x, item.y - target.y);
                
                if (distance < 7 && item.company !== target.company) {
                    conflictGroups.push([item, target]);
                }
            }
        });

        const conflictingIds = new Set(conflictGroups.flat().map(i => i.id));

        filtered.forEach(item => {
            const isConflict = conflictingIds.has(item.id);
            const marker = document.createElement('div');
            
            if (item.resolved) {
                marker.className = 'marker marker-resolved';
            } else if (isConflict) {
                marker.className = 'marker marker-hazard';
            } else {
                marker.className = 'marker marker-normal';
            }

            marker.style.left = `${item.x}%`;
            marker.style.top = `${item.y}%`;
            
            const label = item.building_num ? `${item.company}(${item.building_num}동)` : item.company;
            const icon = item.resolved ? '✅' : (isConflict ? '⚠️' : '📍');
            marker.innerHTML = `${icon} ${label}`;

            marker.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                activeDragId = item.id;
                isDragging = false;
                dragStartPos = { x: e.clientX, y: e.clientY };
                marker.classList.add('dragging');
                if (marker.setPointerCapture) marker.setPointerCapture(e.pointerId);
            });

            marker.addEventListener('pointermove', (e) => {
                if (activeDragId !== item.id) return;

                const moveDist = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);
                if (moveDist > 4) isDragging = true;

                const bgMap = document.getElementById('bgMap');
                const rect = bgMap.getBoundingClientRect();

                let newX = (((e.clientX - rect.left) / rect.width) * 100);
                let newY = (((e.clientY - rect.top) / rect.height) * 100);

                newX = Math.max(0, Math.min(100, newX));
                newY = Math.max(0, Math.min(100, newY));

                item.x = parseFloat(newX.toFixed(1));
                item.y = parseFloat(newY.toFixed(1));

                marker.style.left = `${item.x}%`;
                marker.style.top = `${item.y}%`;

                const bLabel = item.building_num ? `'${item.building_num}동'` : `'이동위치'`;
                document.getElementById('coordsDisplay').innerText = `${bLabel}: { x: ${item.x}, y: ${item.y} }`;
            });

            marker.addEventListener('pointerup', (e) => {
                if (activeDragId === item.id) {
                    activeDragId = null;
                    marker.classList.remove('dragging');
                    if (marker.releasePointerCapture) marker.releasePointerCapture(e.pointerId);
                    
                    syncSavePin(item);

                    if (!isDragging) {
                        openPinModal(item);
                    } else {
                        render();
                    }
                }
            });

            markersArea.appendChild(marker);
        });

        if (conflictGroups.length > 0) {
            conflictGroups.forEach(([a, b]) => {
                const alertBox = document.createElement('div');
                alertBox.className = 'alert-item';
                const locText = a.building_num ? `${a.building_num}동 인접구간` : '동일 위치 영역';
                alertBox.innerHTML = `
                    <div class="alert-title">⚠️ [${currentFloor}] ${locText} 공정간섭!</div>
                    <div class="alert-desc">• <strong>${a.company}</strong> (${a.detail})<br>• <strong>${b.company}</strong> (${b.detail})</div>
                `;
                conflictList.appendChild(alertBox);
            });
        } else {
            conflictList.innerHTML = `<p style="font-size: 12px; color: #64748b;">현재 선택한 층에 간섭 공정이 없습니다.</p>`;
        }
    }

    // 🔍 마우스 휠 도면 포인터 중심 확대/축소 기능
    let currentZoomPercent = 100;
    const mapCardElement = document.getElementById('mapCard');
    const mapWrapperElement = document.querySelector('.map-wrapper');

    mapCardElement.addEventListener('wheel', function(e) {
        // 도면 영역 안에서는 휠을 굴려도 전체 웹페이지가 위아래로 움직이지 않도록 차단
        e.preventDefault(); 
        
        // 1. 마우스 포인터의 현재 상대 위치 (화면 상의 스크롤 영역 기준)
        const rect = mapCardElement.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // 2. 실제 도면(wrapper) 상에서 마우스가 위치한 곳의 전체 픽셀 좌표
        const targetX = mouseX + mapCardElement.scrollLeft;
        const targetY = mouseY + mapCardElement.scrollTop;

        // 3. 현재 도면 크기 대비 마우스 위치의 비율 계산 (예: 0.5면 정중앙)
        const ratioX = targetX / mapWrapperElement.offsetWidth;
        const ratioY = targetY / mapWrapperElement.offsetHeight;

        const oldZoom = currentZoomPercent;

        // 4. 휠을 위로 올리면 20%씩 부드럽게 확대, 내리면 축소
        if (e.deltaY < 0) {
            currentZoomPercent = Math.min(currentZoomPercent + 20, 500); // 최대 500%
        } else {
            currentZoomPercent = Math.max(currentZoomPercent - 20, 100); // 최소 100%
        }

        if (oldZoom === currentZoomPercent) return; // 한계치 도달 시 계산 종료

        // 5. 도면 크기 새로 적용
        mapWrapperElement.style.width = `${currentZoomPercent}%`;
        mapWrapperElement.style.minWidth = `${currentZoomPercent}%`;

        // 6. 크기 변경 직후 새로운 너비/높이를 가져와서 스크롤 위치 보정
        const newWidth = mapWrapperElement.offsetWidth;
        const newHeight = mapWrapperElement.offsetHeight;

        // 마우스 포인터가 있던 위치가 화면상에 그대로 유지되도록 스크롤바 위치 강제 조정
        mapCardElement.scrollLeft = (ratioX * newWidth) - mouseX;
        mapCardElement.scrollTop = (ratioY * newHeight) - mouseY;
    }, { passive: false });

</script>
</body>
